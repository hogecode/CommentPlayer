name: Build CommentPlayer Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build Installer (${{ matrix.os }} - ${{ matrix.arch }})
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows builds
          - os: windows
            arch: amd64
            runs-on: windows-latest
            ext: .exe
          - os: windows
            arch: arm64
            runs-on: windows-latest
            ext: .exe
          # Linux builds
          - os: linux
            arch: amd64
            runs-on: ubuntu-latest
            ext: ''
          - os: linux
            arch: arm64
            runs-on: ubuntu-latest
            ext: ''
          # macOS builds
          - os: darwin
            arch: amd64
            runs-on: macos-latest
            ext: ''
          - os: darwin
            arch: arm64
            runs-on: macos-latest
            ext: ''

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'
          cache: true
          cache-dependency-path: 'installer/go.sum'

      - name: Download dependencies
        working-directory: installer
        run: go mod download

      - name: Build installer
        working-directory: installer
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: go build -o CommentPlayer-Installer${{ matrix.ext }} -ldflags="-s -w" .

      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: CommentPlayer-Installer-${{ matrix.os }}-${{ matrix.arch }}
          path: installer/CommentPlayer-Installer${{ matrix.ext }}
          retention-days: 7

  sign-windows:
    name: Sign Windows Executable
    runs-on: windows-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v3
        with:
          name: CommentPlayer-Installer-windows-amd64
          path: .

      - name: Sign executable (if certificate available)
        run: |
          if ("${{ secrets.CODE_SIGNING_CERTIFICATE }}" -ne "") {
            Write-Host "Signing certificate is available"
            # TODO: 実装: コード署名証明書を使用して .exe に署名
          } else {
            Write-Host "No signing certificate available - skipping signature"
          }

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build, sign-windows]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v3
        with:
          path: artifacts

      - name: Create checksums
        run: |
          cd artifacts
          for dir in */; do
            cd "$dir"
            sha256sum * > SHA256SUMS
            cd ..
          done

      - name: Create release notes
        run: |
          cat > RELEASE_NOTES.md << 'EOF'
          # CommentPlayer Installer Release

          このリリースには、複数のプラットフォーム向けの CommentPlayer インストーラーが含まれています。

          ## 対応プラットフォーム
          - **Windows**: x86_64, ARM64
          - **Linux**: x86_64, ARM64
          - **macOS**: x86_64, ARM64

          ## インストール方法
          1. 対応するプラットフォーム向けのインストーラーをダウンロード
          2. 実行可能権限を付与（Linux/macOS）
          3. インストーラーを実行

          ## ファイル検証
          SHA256 チェックサムを使用して、ダウンロードしたファイルが改ざんされていないことを確認してください。

          ```bash
          sha256sum -c SHA256SUMS
          ```

          ## 変更内容
          ${{ github.event.head_commit.message }}
          EOF

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: CommentPlayer Installer ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false

      - name: Upload release assets
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const release = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag: context.ref.replace('refs/tags/', '')
            });

            // Recursively upload all files from artifacts directory
            const uploadFile = async (filePath) => {
              const fileName = path.basename(filePath);
              const fileContent = fs.readFileSync(filePath);

              await github.rest.repos.uploadReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.data.id,
                name: fileName,
                data: fileContent
              });
            };

            const walk = (dir) => {
              const files = fs.readdirSync(dir);
              for (const file of files) {
                const filePath = path.join(dir, file);
                const stat = fs.statSync(filePath);
                if (stat.isDirectory()) {
                  walk(filePath);
                } else {
                  uploadFile(filePath);
                }
              }
            };

            walk('artifacts');

  notify:
    name: Notify Release
    runs-on: ubuntu-latest
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Get release info
        id: release
        uses: actions/github-script@v7
        with:
          script: |
            const release = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag: context.ref.replace('refs/tags/', '')
            });
            core.setOutput('html_url', release.data.html_url);
            core.setOutput('tag_name', release.data.tag_name);

      - name: Create notification
        run: |
          echo "::notice title=Release Created::CommentPlayer Installer ${{ steps.release.outputs.tag_name }} has been released at ${{ steps.release.outputs.html_url }}"
