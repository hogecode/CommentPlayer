<svg viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- 背景を透明に -->
  <rect width="400" height="200" fill="none" rx="20"/>
  
  <rect x="20" y="20" width="360" height="160" fill="none" stroke="#16a34a" stroke-width="2" rx="10" opacity="0.3"/>
  
  <g filter="url(#glow)">
    <rect x="25" y="45" width="120" height="28" fill="#ef4444" rx="6"/>
    <polygon points="150,55 155,55 150,65" fill="#ef4444"/>
    <text x="35" y="65" font-family="Arial, sans-serif" font-size="12" fill="white" font-weight="bold">wwwwwww</text>
  </g>
  
  <g filter="url(#glow)" opacity="0.85">
    <rect x="160" y="80" width="150" height="28" fill="#3b82f6" rx="6"/>
    <polygon points="310,90 315,90 310,100" fill="#3b82f6"/>
    <text x="170" y="100" font-family="Arial, sans-serif" font-size="12" fill="white" font-weight="bold">キター！</text>
  </g>
  
  <g filter="url(#glow)" opacity="0.7">
    <rect x="250" y="115" width="120" height="28" fill="#eab308" rx="6"/>
    <polygon points="370,125 375,125 370,135" fill="#eab308"/>
    <text x="260" y="135" font-family="Arial, sans-serif" font-size="12" fill="#1a1a2e" font-weight="bold">あああああ</text>
  </g>
  
  <path d="M 310 70 Q 320 70 320 80" stroke="#16a34a" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.5"/>
  <path d="M 310 105 Q 320 105 320 115" stroke="#3b82f6" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.5"/>
  
  <circle cx="380" cy="30" r="8" fill="#16a34a" opacity="0.3"/>
  <circle cx="20" cy="170" r="8" fill="#16a34a" opacity="0.3"/>
  
  <polygon points="375,100 380,95 380,105" fill="#16a34a" opacity="0.4"/>
</svg>